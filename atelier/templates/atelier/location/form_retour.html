{% extends 'atelier/base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <h1 class="h3 mb-2">Restitution Robe {{ location.robe_location.reference_stock }}</h1>
    <p class="text-muted small mb-4">Cliente : {{ location.client }} | Caution initiale : {{ location.caution_montant }} €</p>

    <div class="card p-4 shadow-sm border-0">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'tableau_bord_locations' %}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-success">Valider la restitution</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
