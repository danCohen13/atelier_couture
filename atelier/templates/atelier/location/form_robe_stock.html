{% extends 'atelier/base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 680px;">
    <h1 class="h3 mb-3">{{ titre }}</h1>
    <div class="card p-4 shadow-sm border-0">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'catalogue_location' %}" class="btn btn-outline-secondary">Retour</a>
                <button type="submit" class="btn btn-dark">Ajouter au stock</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
